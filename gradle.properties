snbGroup=me.supernb
snbVersion=0.1.0-SNAPSHOT
org.gradle.daemon=true
org.gradle.parallel=true
# Build Cache:task 输入未变即复用输出(含测试结果)——CI 缓存 build-cache 目录后,改哪个模块只重跑哪个的测试
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
# 本项目暂不启用 configuration-cache(publish/bootRun 与其冲突,保持简单)
org.gradle.configuration-cache=false
