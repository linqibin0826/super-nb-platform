<!doctype html>
<html lang="zh">
  <head>
    <meta charset="UTF-8" />
    <!-- 🚨 首帧防闪 boot：内联、在任何 CSS 之前。真源见 src/ui/theme/snbTheme.ts
         的 THEME_BOOT_SNIPPET（改必四边同步）。cookie 缺席=跟随系统，异常兜底浅色。 -->
    <script>(function(){try{var m=document.cookie.match(/(?:^|;\s*)snb_theme=(dark|light)(?:;|$)/);var t=m?m[1]:(window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');var e=document.documentElement;e.classList.toggle('dark',t==='dark');e.style.colorScheme=t}catch(_){}})()</script>
    <link rel="icon" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 移动端浏览器 UI 配色。⚠️ media 只认**系统**偏好，用户显式选了与系统相反的档时
         这条会差一档——theme-color 没有「跟 cookie 走」的写法，只影响浏览器外壳不影响页面。
         值 = tokens.css 两档的页面底（浅 #F2EEE6 / 深 #0E1014）。 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#F2EEE6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0E1014" />
    <title>创作工坊 · SUPER NB</title>
    <meta name="description" content="SUPER·NB 创作工坊：描述画面、选好规格，用 gpt-image-2 按官方价生成图片，逛灵感库找参考，生成的每一张都归你。" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="SUPER·NB 创作工坊" />
    <meta property="og:title" content="创作工坊 · SUPER NB" />
    <meta property="og:description" content="描述画面、选好规格，按官方价生成图片，逛灵感库找参考。" />
    <meta property="og:url" content="https://studio.super-nb.me/" />
    <meta property="og:image" content="https://studio.super-nb.me/og.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <link rel="preconnect" href="https://media.super-nb.me" crossorigin />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 首屏预取：与主 JS 并行发起灵感库首页请求，主逻辑就绪时直接消费，省一跳串行等待。
      // 查询串须与 src/lib/galleryApi.ts 的 buildPromptsQuery 默认输出逐字节一致（page=1&pageSize=24）。
      window.__SNB_PREFETCH__ = {
        prompts: fetch('/gallery/v1/prompts?page=1&pageSize=24').then(function (r) { return r.ok ? r.json() : null }).catch(function () { return null }),
        categories: fetch('/gallery/v1/categories').then(function (r) { return r.ok ? r.json() : null }).catch(function () { return null }),
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
