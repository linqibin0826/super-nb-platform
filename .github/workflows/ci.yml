name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      # Build Cache:改哪个模块只重跑哪个的测试,未改模块从 cache 恢复"已通过"(key 用 sha 累积、前缀 restore 最近)
      - name: 缓存 Gradle Build Cache
        uses: actions/cache@v4
        with:
          path: ~/.gradle/caches/build-cache-1
          key: gradle-buildcache-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            gradle-buildcache-${{ runner.os }}-
      - name: Build & Test
        run: ./gradlew build --console=plain
