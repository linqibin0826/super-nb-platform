spring:
  application:
    name: snb-platform
  datasource:
    url: ${SNB_DB_URL:jdbc:postgresql://localhost:5432/snb}
    username: ${SNB_DB_USER:snb_app}
    password: ${SNB_DB_PASSWORD:}
    hikari:
      # 写池上限;默认 10,2026-07-16 随只读池一并减半
      maximum-pool-size: 5
  flyway:
    enabled: ${SNB_FLYWAY_ENABLED:true}
    locations: classpath:db/migration/activity,classpath:db/migration/gallery,classpath:db/migration/content,classpath:db/migration/invoice,classpath:db/migration/guide,classpath:db/migration/ops
    schemas: activity,gallery,content,invoice,guide,ops
    create-schemas: true
  jpa:
    # schema 由 Flyway 全权管理;validate 只校验实体映射与库结构一致
    hibernate:
      ddl-auto: validate
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

sub2api:
  base-url: ${SUB2API_BASE_URL:http://localhost:8080}
  introspect-cache-seconds: 30
  read-datasource:
    url: ${SUB2API_RO_URL:jdbc:postgresql://localhost:5432/sub2api}
    username: ${SUB2API_RO_USER:snb_ro}
    password: ${SUB2API_RO_PASSWORD:}
  # admin-key 仅经环境变量 SUB2API_ADMIN_KEY 注入;绝不给 yml 默认值——缺省时该属性在
  # Environment 中完全不存在,Sub2apiAdminAutoConfiguration / SubscriptionGrantAdapter 的
  # @ConditionalOnProperty(prefix="sub2api", name="admin-key") 才能真正 fail-closed
  # (yml 给空串默认值会让属性"永远存在但值为空",该注解无 havingValue 时空串≠"false"即判匹配,
  # 会让两个 Bean 恒装配,复审探针已实测坐实此坑,2026-07-14 修复)。

gallery:
  # R2 凭据仅经环境变量注入(GALLERY_R2_ENDPOINT / GALLERY_R2_BUCKET / GALLERY_R2_ACCESS_KEY /
  # GALLERY_R2_SECRET_KEY / GALLERY_R2_PUBLIC_ENDPOINT)。缺 endpoint 时 R2Config 不激活(如测试)。
  ratelimit:
    burst: 60
    per-minute: 120

activity:
  referral:
    start: ${QQ_CAMPAIGN_START:2026-07-09T16:00:00Z}
    end: ${QQ_CAMPAIGN_END:2026-07-16T16:00:00Z}
    newcomer-group-id: ${QQ_CAMPAIGN_GROUP_ID:77}
    cap: 288
    limit: 10
  gate:
    # 金票闸机(spec 2026-07-12-gate-golden-ticket):win-rate ≤0 = 闸机休眠
    threshold-cny: ${GATE_THRESHOLD_CNY:30}
    win-rate: ${GATE_WIN_RATE:0.02}
  thursday:
    # 疯四桶自助领取(spec 2026-07-28-grand-opening §3)。sessions 空 = 功能休眠。
    # 格式 `yyyy-MM-dd=groupId`,逗号分隔。🚨 一场一个分组——三场共用会让第二场的
    # 回头客被 sub2api 的 (user_id,group_id) 幂等静默判成"已领过"(详见 ThursdayProperties)。
    sessions: ${THURSDAY_SESSIONS:}
    min-amount-cny: ${THURSDAY_MIN_AMOUNT_CNY:50}
    bucket-limit: ${THURSDAY_BUCKET_LIMIT:50}
    validity-days: ${THURSDAY_VALIDITY_DAYS:1}
    notes: ${THURSDAY_NOTES:opening-fk}
    # 隐藏款(瑞幸)确定性摇号:reveal-at 之前不揭晓,之后名单冻结、号也随之定死
    hidden-count: ${THURSDAY_HIDDEN_COUNT:3}
    hidden-salt: ${THURSDAY_HIDDEN_SALT:}
    reveal-at: ${THURSDAY_REVEAL_AT:22:00}
    # 猜桶竞猜:门槛与金票闸机同口径(累计真实充值),封猜后不再收
    guess-close-at: ${THURSDAY_GUESS_CLOSE_AT:20:00}
    guess-threshold-cny: ${THURSDAY_GUESS_THRESHOLD_CNY:30}
  school:
    # 带兄弟来包机(2026-08-13,ai-relay runbook 41;玩法 v2=spec §4-v2):新客首充三档总额卡 +
    # 邀请卡养成 Go/Plus/ProLite/Pro(节点 1/5/10/20)+ 重置银行 + 拉人榜。
    # start/end 空或七组任一为 0 = 功能休眠(端点回 closed)。
    # ⚠️ compose 不加 environment 映射 = 这里的默认值(休眠)静默生效——上线必须映射全 9 键。
    # ⚠️ start/end/claim-deadline 是 ISO-8601 Instant,格式错启动直接失败(宁可起不来)。
    # 🚨 七组分立(首充三档 + 邀请卡四档):总额卡靠周/月窗封顶,同组续期只加天数不重置额度
    # (07-31 日卡事故的反向应用);升档换新档组=消耗从零(隐形满血);重置走 admin reset-quota。
    start: ${SCHOOL_START:}
    end: ${SCHOOL_END:}
    claim-deadline: ${SCHOOL_CLAIM_DEADLINE:}   # 缺省 = end + 48h(宽限只放领取,资格钉 [start,end))
    fc-group-50: ${SCHOOL_FC_GROUP_50:0}
    fc-group-100: ${SCHOOL_FC_GROUP_100:0}
    fc-group-200: ${SCHOOL_FC_GROUP_200:0}
    card-group-go: ${SCHOOL_CARD_GROUP_GO:0}
    card-group-plus: ${SCHOOL_CARD_GROUP_PLUS:0}
    card-group-prolite: ${SCHOOL_CARD_GROUP_PROLITE:0}
    card-group-pro: ${SCHOOL_CARD_GROUP_PRO:0}
    validity-days: ${SCHOOL_VALIDITY_DAYS:3}    # 首充卡固定 3 天;邀请卡有效期动态=发卡→活动结束
    notes: ${SCHOOL_NOTES:school-season}
    rate-limit:
      capacity: ${SCHOOL_RATE_LIMIT_CAPACITY:30}
      refill-per-sec: ${SCHOOL_RATE_LIMIT_REFILL:5}
  checkin:
    launch-date: ${CHECKIN_LAUNCH_DATE:2026-07-13}
    daily-nb-points: ${CHECKIN_DAILY_NB_POINTS:3}
    monthly-budget-cap: ${CHECKIN_MONTHLY_BUDGET_CAP:250}
    per-user-monthly-cap: ${CHECKIN_PER_USER_MONTHLY_CAP:10}
    scan-enabled: ${CHECKIN_SCAN_ENABLED:false}
    tier-reward-enabled: ${CHECKIN_TIER_REWARD_ENABLED:false}
    rate-limit:
      capacity: ${CHECKIN_RATE_LIMIT_CAPACITY:30}
      refill-per-sec: ${CHECKIN_RATE_LIMIT_REFILL:5}
    tier:
      a:
        threshold: ${CHECKIN_TIER_A_THRESHOLD:30}
        group-id: ${CHECKIN_TIER_A_GROUP_ID:0}
        cost-cny: ${CHECKIN_TIER_A_COST_CNY:0.9}
      b:
        threshold: ${CHECKIN_TIER_B_THRESHOLD:50}
        group-id: ${CHECKIN_TIER_B_GROUP_ID:0}
        cost-cny: ${CHECKIN_TIER_B_COST_CNY:1.9}
      c:
        threshold: ${CHECKIN_TIER_C_THRESHOLD:500}
        group-id: ${CHECKIN_TIER_C_GROUP_ID:0}
        cost-cny: ${CHECKIN_TIER_C_COST_CNY:4.4}
    # 加时资格的当月**累计**出勤门槛(原「满勤」,2026-07-31 放宽——满勤命中率仅 1%;
    # 同日站长二次拍板 20→15)
    full-month-days: ${CHECKIN_FULL_MONTH_DAYS:15}
    # 每日返网费(spec 2026-07-31-checkin-daily-reward §6):连签第 N 天返
    # per-day-cny × ⌈N/step-days⌉(§12 两天一档:step-days=2 → 0.1/0.1/0.2/0.2…,
    # 满月上限 ¥25.6;step-days=1 即原线性)。
    # enabled 默认 false fail-closed——不配 env 就只发 NB 不发钱。
    # ⚠️ compose 不加 environment 映射 = 这里的默认值静默生效(GATE_ 老教训)。
    balance:
      enabled: ${CHECKIN_BALANCE_ENABLED:false}
      per-day-cny: ${CHECKIN_BALANCE_PER_DAY_CNY:0.1}
      threshold-cny: ${CHECKIN_BALANCE_THRESHOLD_CNY:30}
      monthly-cap-cny: ${CHECKIN_BALANCE_MONTHLY_CAP_CNY:3000}
      step-days: ${CHECKIN_BALANCE_STEP_DAYS:1}
    # 准入闸(spec §12,2026-07-31 站长拍板):近 window-days 天真实充值 ≥ min-cny 才能签到,
    # 状态接口报 recharge_required、打卡 403。enabled 默认 false = 人人可签(旧行为)。
    # ⚠️ 前缀刻意用 CHECKIN_ENTRY_,别与金票闸机 GATE_ 混淆。
    entry-gate:
      enabled: ${CHECKIN_ENTRY_GATE_ENABLED:false}
      window-days: ${CHECKIN_ENTRY_GATE_WINDOW_DAYS:30}
      min-cny: ${CHECKIN_ENTRY_GATE_MIN_CNY:30}
  achievement:
    retroactive-backfill-enabled: ${CHECKIN_RETROACTIVE_BACKFILL_ENABLED:false}

content:
  # admin 写接口令牌（发布管线经 SSH 隧道调用）；缺省空值=fail-closed 一律 401
  admin-token: ${CONTENT_ADMIN_TOKEN:}
  ratelimit:
    burst: 60
    per-minute: 120

invoice:
  ratelimit:
    burst: 30
    per-minute: 60
  # 抬头核验(聚美智数,阿里云云市场按次付费):appcode 缺省空值=核验功能整体静默关闭
  registry:
    appcode: ${JUMEI_INVOICE_APPCODE:}
    user-daily: 10
    global-daily: 40
  # 开票资料 AI 识别(自家中转 gpt-5.6-luna,~400 tokens/次):key 走 env SUB2API_INVOICE_AI_KEY
  # (sub2api.invoice-ai-key 相对宽松绑定,绝不进 yml——缺席即整体不装配 fail-closed)
  ai:
    user-daily: 20
    global-daily: 200

ops:
  # 账号库 AES-256-GCM 密钥(base64 编码 32 字节);仅经 env OPS_SECRET_KEY 注入。
  # 缺省空值=加解密端点 fail-closed(500),绝不给 yml 写真值默认。
  secret-key: ${OPS_SECRET_KEY:}
